name: iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Send this build to TestFlight"
        type: boolean
        default: true

jobs:
  # Every push: compile the app and take simulator screenshots of each screen.
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [(rt, x) for rt, l in d.items() if 'iOS' in rt for x in l if x['name'].startswith('iPhone')]
          best = [p for p in phones if 'Pro Max' in p[1]['name']] or phones
          best.sort(key=lambda p: p[0])
          print(best[-1][1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project AIComputer.xcodeproj -scheme AIComputer -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/AIComputer.app
      - name: Screenshots
        run: |
          mkdir -p shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/AIComputer.app
          shoot() { xcrun simctl launch --terminate-running-process "$UDID" com.matheesha.aicomputer "$@"; sleep 5; }
          for s in welcome home desktop agents mcp settings; do
            shoot -screen $s; xcrun simctl io "$UDID" screenshot "shots/$s.png"
          done
          for a in files browser terminal assistant; do
            shoot -screen home -app $a; xcrun simctl io "$UDID" screenshot "shots/app-$a.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-log
          path: |
            shots
            build.log

  # Manual run only: sign with your Apple account and upload to TestFlight.
  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project AIComputer.xcodeproj -scheme AIComputer -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AIComputer.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/AIComputer.xcarchive"
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AIComputer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: "*.log"

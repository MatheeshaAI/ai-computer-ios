name: iSH engine

# Phase 1 of on-device Linux: build the iSH-ARM64 static libraries for iPhone
# and the Alpine Linux root filesystem, and publish them as an artifact.
on:
  push:
    branches: [main]
    paths: [deps/**, .github/workflows/ish.yml]
  workflow_dispatch:

jobs:
  ish:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install build tools
        run: |
          brew install meson ninja llvm lld libarchive
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build iSH libraries (iPhone, arm64)
        run: bash deps/build_ish.sh release
      - name: Build Alpine root filesystem
        run: bash deps/prepare_alpine_rootfs.sh
      - name: Summary
        run: |
          ls -lh deps/libs deps/resources
          du -sh deps/include
      - uses: actions/upload-artifact@v4
        with:
          name: ish-engine
          path: |
            deps/libs
            deps/include
            deps/resources/*.zip
            deps/resources/*.elf
            deps/resources/RootfsPatch.bundle

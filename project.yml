name: AIComputer
options:
  bundleIdPrefix: com.matheesha
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AIComputer:
    type: application
    platform: iOS
    sources:
      - AIComputer
      # Alpine Linux root filesystem (fakefs), staged by .github/actions/ish-engine.
      - path: Generated/alpine-rootfs
        type: folder
        buildPhase: resources
    scheme: {}
    info:
      path: AIComputer/Info.plist
      properties:
        CFBundleDisplayName: AI Computer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Plain HTTP is needed for the PC bridge (encrypted by Tailscale). This key replaces
          # NSAllowsArbitraryLoadsInWebContent, which would make iOS ignore it, and also covers the web view.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matheesha.aicomputer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # iSH-ARM64 emulator (deps/ish), built by .github/actions/ish-engine.
        SWIFT_OBJC_BRIDGING_HEADER: AIComputer/Linux/AIComputer-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/deps/include/ish
        # Must match the defines deps/ish/meson.build used for the libraries.
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) GUEST_ARM64=1 ENGINE_ASBESTOS=1 LOG_HANDLER_NSLOG=1 ISH_JIT=1 ISH_JIT_NO_EMIT=1
        GCC_C_LANGUAGE_STANDARD: gnu11
        ISH_LIBS_DIR: $(SRCROOT)/deps/libs
        "ISH_LIBS_DIR[sdk=iphonesimulator*]": $(SRCROOT)/deps/libs/iphonesimulator
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        OTHER_LDFLAGS: $(inherited) $(ISH_LIBS_DIR)/libish.a $(ISH_LIBS_DIR)/libish_emu.a $(ISH_LIBS_DIR)/libfakefs.a -force_load $(ISH_LIBS_DIR)/libish_aot.a -lsqlite3
